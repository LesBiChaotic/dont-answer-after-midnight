<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141622" />
      <stop offset="50%" stop-color="#0c0d12" />
      <stop offset="100%" stop-color="#181528" />
    </linearGradient>
    <linearGradient id="moon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#2a2e45" stroke-width="2" />
  
  <!-- Outer subtle radar / late hours rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#31364d" stroke-width="2" stroke-dasharray="8 8" opacity="0.6" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#3d4463" stroke-width="1.5" opacity="0.4" />
  
  <!-- Stylized Crescent Moon & Pulse -->
  <g filter="url(#glow)">
    <path d="M 270 140 C 200 140 144 196 144 266 C 144 336 200 392 270 392 C 314 392 352 369 374 334 C 330 346 278 322 258 274 C 242 236 256 190 286 164 C 281 149 275 140 270 140 Z" fill="url(#moon-grad)" />
  </g>
  
  <!-- Small indicator star / signal dot -->
  <circle cx="360" cy="180" r="10" fill="#a5b4fc" filter="url(#glow)" />
  <circle cx="360" cy="180" r="5" fill="#ffffff" />
  
  <!-- Text 'AH' minimalist accent -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="8">AFTERHOURS</text>
</svg>
