<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#11101A" id="theme-color-meta" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Afterhours" />
    <meta name="description" content="AFTERHOURS - A mobile-first late night communication network." />
    <script>
      // Apply the saved palette before CSS and React mount to prevent a dark-theme flash.
      (() => {
        const colors = { dark: '#11101A', light: '#F7F2F7', 'dead-signal': '#071522', 'archive-amber': '#17120B', 'crt-green': '#07110B', 'blood-moon': '#17090D', 'something-wrong': '#ECE9DF' };
        try {
          const saved = JSON.parse(localStorage.getItem('afterhours_settings') || '{}');
          const requested = saved.theme || 'dark';
          const resolved = requested === 'device'
            ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : requested;
          document.documentElement.dataset.theme = resolved;
          document.documentElement.classList.add(resolved === 'light' ? 'light' : 'dark');
          document.querySelector('#theme-color-meta')?.setAttribute('content', colors[resolved] || colors.dark);
        } catch { document.documentElement.classList.add('dark'); }
      })();
    </script>
    
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/icon-192.svg" />
    
    <!-- Preconnect for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
    
    <title>AFTERHOURS</title>
  </head>
  <body class="bg-night-bg text-night-text antialiased select-none overscroll-none touch-manipulation">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      // Register service worker if supported
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => {
              console.log('[PWA] Service Worker registered with scope:', reg.scope);
            })
            .catch(err => {
              console.warn('[PWA] Service Worker registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
